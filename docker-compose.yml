# One-command local Postgres for running the GhostMap mirror.
#
# Usage:
#   docker compose up -d
#   cp env.example .env   # then set AIRTABLE_TOKEN and POSTGRES_* (see README)
#   python airtable_to_postgres.py
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ghostmap
      POSTGRES_USER: ghostmap
      POSTGRES_PASSWORD: ghostmap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostmap -d ghostmap"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
